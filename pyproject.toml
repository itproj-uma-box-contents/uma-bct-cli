[project]
name = "uma-bct-cli"
version = "0.1.0"
description = "Offline archive-box detection and transcription CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "ollama>=0.6,<1",
    "opencv-python-headless>=5,<6",
    "openpyxl>=3.1,<4",
    "pandas>=3,<4",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "hatchling==1.27.0",
    "ruff>=0.12,<1",
]

[project.scripts]
uma-bct = "uma_bct.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uma_bct"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/Archive box photos",
    "/add_repository_photos",
    "/inputs",
    "/outputs",
    "/*.csv",
    "/*.xlsx",
    "/*.run.json",
    "**/*.run.json",
    "**/.uma-bct-json-*.tmp",
    "**/.uma-bct-catalogue-*",
    "/.ollama",
    "/models",
    "*.gguf",
    "*.onnx",
    "*.pt",
    "*.pth",
    "*.safetensors",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["Archive box photos", "add_repository_photos"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
