[project]
name = "uma-bct-cli"
version = "0.1.0"
description = "Offline archive-box detection and transcription CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "ollama",
    "opencv-python",
    "pandas",
]

[project.scripts]
uma-bct = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
