name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.15"

jobs:
  build-dist:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Verify tagged commit is contained in main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Refuse to replace an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_response="$RUNNER_TEMP/uma-bct-existing-release.json"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$release_status" in
            404) ;;
            200)
              echo "Release $GITHUB_REF_NAME already exists; release tags are immutable." >&2
              exit 1
              ;;
            *)
              echo "Could not verify release immutability (HTTP $release_status)." >&2
              exit 1
              ;;
          esac
      - name: Set up Docker Buildx for immutable-tag checks
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GHCR for immutable-tag checks
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace existing container tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for suffix in "" "-amd64" "-arm64"; do
            candidate="${image}:${GITHUB_REF_NAME}${suffix}"
            inspect_log="$RUNNER_TEMP/uma-bct-image-inspect.log"
            if docker buildx imagetools inspect "$candidate" >"$inspect_log" 2>&1; then
              echo "Container tag already exists and is immutable: $candidate" >&2
              exit 1
            fi
            if ! grep -Eiq \
              'manifest unknown|name unknown|unexpected status.*404 Not Found' \
              "$inspect_log"; then
              echo "Could not verify container-tag immutability for $candidate:" >&2
              cat "$inspect_log" >&2
              exit 1
            fi
          done
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked environment
        run: uv sync --locked --dev --python 3.12
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv run python -c 'from importlib.metadata import version; print(version("uma-bct-cli"))')"
          test "v${package_version}" = "$GITHUB_REF_NAME"
      - name: Run release checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage report
      - name: Build exact release distributions and checksums
        run: |
          uv build --no-build-isolation
          uv run python scripts/check_release_artifacts.py dist
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 5

  verify-dist:
    name: Verify release distributions
    runs-on: ubuntu-latest
    needs: build-dist
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Download exact release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Reinspect exact release artifacts for private data
        run: uv run --no-project python scripts/check_release_artifacts.py dist
      - name: Smoke-test wheel and source distribution
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact_path="$PWD/$artifact"
            smoke_dir="$(mktemp -d)"
            uv venv --python 3.12 "$smoke_dir/.venv"
            uv pip install --python "$smoke_dir/.venv/bin/python" "$artifact_path"
            (
              cd "$smoke_dir"
              "$smoke_dir/.venv/bin/python" -c "import uma_bct"
              "$smoke_dir/.venv/bin/uma-bct" --help
              "$smoke_dir/.venv/bin/uma-bct" --version
              "$smoke_dir/.venv/bin/python" -m uma_bct --help
            )
          done

  publish-container:
    name: Publish multi-architecture container
    runs-on: ubuntu-latest
    needs: verify-dist
    permissions:
      contents: read
      packages: write
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Derive lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the exact amd64 release image for local smoke testing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Build the exact arm64 release image for local smoke testing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: production
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Smoke-test both exact release images before publishing
        shell: bash
        run: |
          amd64_image="${{ steps.image.outputs.name }}:${{ github.ref_name }}-amd64"
          arm64_image="${{ steps.image.outputs.name }}:${{ github.ref_name }}-arm64"
          output_dir="$RUNNER_TEMP/uma-bct-release-output"
          mkdir -p "$output_dir"
          docker run --rm --platform linux/amd64 "$amd64_image" --help
          docker run --rm --platform linux/arm64 "$arm64_image" --help
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --entrypoint python \
            --mount "type=bind,source=$output_dir,target=/data/outputs" \
            "$amd64_image" \
            -c "from pathlib import Path; Path('/data/outputs/probe').write_text('ok', encoding='utf-8')"
          test "$(cat "$output_dir/probe")" = "ok"
      - name: Run the tagged source's mocked-model container suite
        shell: bash
        run: |
          docker build --target test -t uma-bct-cli:${GITHUB_REF_NAME}-test .
          docker run --rm uma-bct-cli:${GITHUB_REF_NAME}-test
      - name: Authenticate to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images as one multi-architecture tag
        shell: bash
        run: |
          image="${{ steps.image.outputs.name }}"
          amd64_image="${image}:${GITHUB_REF_NAME}-amd64"
          arm64_image="${image}:${GITHUB_REF_NAME}-arm64"
          release_image="${image}:${GITHUB_REF_NAME}"
          docker push "$amd64_image"
          docker push "$arm64_image"
          docker buildx imagetools create \
            --tag "$release_image" \
            "$amd64_image" \
            "$arm64_image"
          docker buildx imagetools inspect "$release_image"

  publish-release:
    name: Publish private GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-dist, publish-container]
    permissions:
      contents: write
    environment: release
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Create release and attach artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
