name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked development environment
        run: uv sync --locked --dev --python 3.12
      - name: Check client dependency constraints
        shell: bash
        run: |
          uv export --quiet --locked --no-dev --group client-bootstrap \
            --no-emit-project --no-header \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/client-constraints.txt"
          diff -u client-constraints.txt "$RUNNER_TEMP/client-constraints.txt"
      - name: Check lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts main.py

  unit:
    name: Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked development environment
        run: uv sync --locked --dev --python 3.12
      - name: Run model-free tests with coverage
        run: uv run coverage run -m unittest discover -s tests -v
      - name: Enforce coverage floor
        run: uv run coverage report

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: [lint, unit]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked build environment
        run: uv sync --locked --dev --python 3.12
      - name: Build wheel and source distribution
        run: uv build --no-build-isolation
      - name: Build one-command client bundle
        run: uv run python scripts/build_client_bundle.py dist
      - name: Reject private data in release artifacts
        run: uv run --no-project python scripts/check_release_artifacts.py dist
      - name: Smoke-test exact client dependency workflow
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uma-bct-client-cache"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uma-bct-client-python"
          wheel=(dist/*.whl)
          app="$RUNNER_TEMP/uma-bct-client-app"
          uv venv --no-config --clear --managed-python --python 3.12 "$app"
          uv pip sync --no-config --require-hashes \
            --python "$app/bin/python" client-constraints.txt
          uv pip install --no-config --offline --no-deps \
            --python "$app/bin/python" "${wheel[0]}"
          "$app/bin/uma-bct" --help
          uv pip install --no-config --offline --no-deps --reinstall \
            --python "$app/bin/python" "${wheel[0]}"
          "$app/bin/uma-bct" --version
      - name: Smoke-test exact client dependency workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uma-bct-client-cache"
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "uma-bct-client-python"
          $wheel = Get-ChildItem -Path dist -Filter "*.whl" -File
          $app = Join-Path $env:RUNNER_TEMP "uma-bct-client-app"
          uv venv --no-config --clear --managed-python --python 3.12 $app
          $python = Join-Path $app "Scripts/python.exe"
          $cli = Join-Path $app "Scripts/uma-bct.exe"
          uv pip sync --no-config --require-hashes `
            --python $python client-constraints.txt
          uv pip install --no-config --offline --no-deps `
            --python $python $wheel.FullName
          & $cli --help
          uv pip install --no-config --offline --no-deps --reinstall `
            --python $python $wheel.FullName
          & $cli --version
      - name: Install and inspect each distribution outside the checkout
        if: runner.os != 'Windows'
        shell: bash
        run: |
          repository_root="$PWD"
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact_path="$repository_root/$artifact"
            smoke_dir="$(mktemp -d)"
            uv venv --python 3.12 "$smoke_dir/.venv"
            uv pip install --python "$smoke_dir/.venv/bin/python" "$artifact_path"
            (
              cd "$smoke_dir"
              "$smoke_dir/.venv/bin/python" -c "import uma_bct"
              "$smoke_dir/.venv/bin/uma-bct" --help
              "$smoke_dir/.venv/bin/uma-bct" --version
              "$smoke_dir/.venv/bin/uma-bct" setup --help
              "$smoke_dir/.venv/bin/python" -m uma_bct --help
            )
          done
      - name: Install and inspect each distribution outside the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $artifacts = Get-ChildItem -Path dist -File |
            Where-Object { $_.Name -match '\.(whl|tar\.gz)$' }
          foreach ($artifact in $artifacts) {
            $smokeDir = Join-Path $env:RUNNER_TEMP ("uma-bct-smoke-" + [guid]::NewGuid())
            $venvDir = Join-Path $smokeDir ".venv"
            uv venv --python 3.12 $venvDir
            $python = Join-Path $venvDir "Scripts/python.exe"
            $cli = Join-Path $venvDir "Scripts/uma-bct.exe"
            uv pip install --python $python $artifact.FullName
            Push-Location $smokeDir
            try {
              & $python -c "import uma_bct"
              & $cli --help
              & $cli --version
              & $cli setup --help
              & $python -m uma_bct --help
            } finally {
              Pop-Location
            }
          }

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --target production -t uma-bct-cli:ci .
      - name: Check container entry point
        run: |
          docker run --rm uma-bct-cli:ci --help
          docker run --rm uma-bct-cli:ci setup --help
      - name: Verify Compose writes outputs as the host user
        shell: bash
        run: |
          mkdir -p inputs outputs
          UMA_BCT_IMAGE=uma-bct-cli:ci \
          UMA_BCT_UID="$(id -u)" \
          UMA_BCT_GID="$(id -g)" \
          docker compose run --rm --no-deps \
            --entrypoint python \
            app \
            -c "from pathlib import Path; Path('/data/outputs/probe').write_text('ok', encoding='utf-8')"
          test "$(cat outputs/probe)" = "ok"
      - name: Build model-free test image
        run: docker build --target test -t uma-bct-cli:test .
      - name: Run mocked-model tests in the container
        run: docker run --rm uma-bct-cli:test
