name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.9"

jobs:
  checks:
    name: Tests and package
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            docs_only="$(bash scripts/classify_ci_changes.sh pull_request "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          else
            docs_only="$(bash scripts/classify_ci_changes.sh push "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: steps.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: steps.changes.outputs.docs_only != 'true'
        run: uv python install 3.12
      - if: steps.changes.outputs.docs_only != 'true'
        run: uv sync --locked --dev --python 3.12
      - name: Check generated client dependencies
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          uv export --quiet --locked --no-dev --extra hosted --group client-bootstrap --no-emit-project --no-header --format requirements-txt --output-file "$RUNNER_TEMP/client-constraints.txt"
          tail -n +3 client-constraints.txt > "$RUNNER_TEMP/committed-constraints.txt"
          diff -u "$RUNNER_TEMP/committed-constraints.txt" "$RUNNER_TEMP/client-constraints.txt"
      - if: steps.changes.outputs.docs_only != 'true'
        run: uv run ruff check .
      - name: Run compact model-free suite
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage report
      - name: Build and inspect deliverables
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          uv build --no-build-isolation
          uv run python scripts/build_client_bundle.py dist
          uv run python scripts/check_release_artifacts.py dist
      - name: Smoke-test wheel and source distribution
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          root="$PWD"
          for artifact in dist/*.whl dist/*.tar.gz; do
            smoke="$(mktemp -d)"
            uv venv --python 3.12 "$smoke/.venv"
            uv pip sync --require-hashes --python "$smoke/.venv/bin/python" "$root/client-constraints.txt"
            uv pip install --no-deps --python "$smoke/.venv/bin/python" "$root/$artifact"
            (
              cd "$smoke"
              "$smoke/.venv/bin/uma-bct" --help
              "$smoke/.venv/bin/uma-bct" --version
              "$smoke/.venv/bin/python" -m uma_bct --help
              "$smoke/.venv/bin/python" "$root/scripts/smoke_hosted_install.py"
            )
          done

  platform:
    name: Platform tests (${{ matrix.name }})
    needs: checks
    if: needs.checks.outputs.docs_only != 'true'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS arm64
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - run: uv run python -m unittest discover -s tests -v
      - name: Exercise all supported entry paths
        run: |
          uv run uma-bct --help
          uv run python -m uma_bct --help
          uv run python main.py --help
      - name: Build a native smoke-test wheel
        run: uv build --wheel --no-build-isolation --out-dir "${{ runner.temp }}/uma-bct-dist"
      - name: Smoke-test the installed wheel (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          root="$PWD"
          smoke="$(mktemp -d)"
          uv venv --python 3.12 "$smoke/.venv"
          # Match the launcher's complete hash-pinned environment, including hosted support.
          uv pip sync --require-hashes --python "$smoke/.venv/bin/python" "$root/client-constraints.txt"
          uv pip install --offline --no-deps --python "$smoke/.venv/bin/python" "${{ runner.temp }}"/uma-bct-dist/*.whl
          (
            cd "$smoke"
            "$smoke/.venv/bin/uma-bct" --help
            "$smoke/.venv/bin/uma-bct" --version
            "$smoke/.venv/bin/python" -m uma_bct --help
            "$smoke/.venv/bin/python" "$root/scripts/smoke_hosted_install.py"
          )
      - name: Smoke-test the installed wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Repository = (Get-Location).Path
          $Smoke = Join-Path $env:RUNNER_TEMP "uma-bct-smoke"
          uv venv --python 3.12 $Smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Wheel = Get-ChildItem (Join-Path $env:RUNNER_TEMP "uma-bct-dist\*.whl") | Select-Object -First 1
          $Python = Join-Path $Smoke "Scripts\python.exe"
          uv pip sync --require-hashes --python $Python (Join-Path $Repository "client-constraints.txt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --offline --no-deps --python $Python $Wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $Smoke
          try {
            & (Join-Path $Smoke "Scripts\uma-bct.exe") --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $Smoke "Scripts\uma-bct.exe") --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $Python -m uma_bct --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $Python (Join-Path $Repository "scripts/smoke_hosted_install.py")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

  docker:
    name: Docker smoke (${{ matrix.name }})
    needs: checks
    if: needs.checks.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: docker compose config --quiet
      - run: docker build --target production -t uma-bct-cli:ci .
      - run: docker run --rm uma-bct-cli:ci --help
