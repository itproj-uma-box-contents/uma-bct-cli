# Opt-in second independent runner: Qwen3-VL cannot batch parallel requests
# inside Ollama 0.32.9. Both runners must pass full-GPU readiness before use.
# No published ports; both use the existing private bridge and exact model.
services:
  ollama-parallel:
    image: ollama/ollama:0.32.9@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      # Already downloaded model state; the extra service cannot change it.
      - /var/lib/uma-bct-demo/models:/root/.ollama:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
networks:
  default:
    external: true
    name: uma-bct-demo_default
